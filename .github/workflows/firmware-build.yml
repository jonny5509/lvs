name: Firmware build

on:
  push:
    branches:
      - main
      - experiment/lovense-serial-dongle
  pull_request:
    branches:
      - main
      - experiment/lovense-serial-dongle
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build ESP32 firmware
        run: pio run -e esp32dev
      - name: Upload ESP32 build binaries
        uses: actions/upload-artifact@v4
        with:
          name: lvs-esp32dev-build
          path: .pio/build/esp32dev/*.bin
          if-no-files-found: error
          retention-days: 30
