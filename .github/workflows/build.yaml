name: CI

on:
  push:
    branches: [ main, stable ]
  pull_request:
    branches: [ main, stable ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/
            .pio
          key: ${{ runner.os }}-pio

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Install PlatformIO packages
        run: pio pkg install

      - name: pio check
        run: pio check --fail-on-defect medium

      - name: Build firmware
        run: pio run -e esp32dev

      - name: Prepare ESP Web Tools firmware parts
        run: |
          mkdir -p web/firmware
          cp .pio/build/esp32dev/bootloader.bin web/firmware/bootloader.bin
          cp .pio/build/esp32dev/partitions.bin web/firmware/partitions.bin
          BOOT_APP0="$(find ~/.platformio -name boot_app0.bin -type f -print -quit)"
          if [ -z "$BOOT_APP0" ]; then echo "boot_app0.bin not found in PlatformIO packages"; exit 1; fi
          cp "$BOOT_APP0" web/firmware/boot_app0.bin
          cp .pio/build/esp32dev/firmware.bin web/firmware/firmware.bin
          ls -lh web/firmware/

      - name: Generate ESP Web Tools manifest
        run: python generate_esp_web_tools.py

      - name: Deploy to GitHub Pages
        if: ${{ github.event_name != 'pull_request' }}
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: web/
